<!DOCTYPE html>
<html>
<head>
  <title>Generate App Icons</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #1a1a1a; color: white; }
    canvas { display: block; margin: 10px 0; border: 1px solid #333; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .icon-group { margin: 20px 0; }
  </style>
</head>
<body>
  <h1>App Icon Generator</h1>
  <p>Click each button to download the icon, then save them to the icons folder.</p>

  <div class="icon-group">
    <h3>iOS Icon (180x180)</h3>
    <canvas id="icon180" width="180" height="180"></canvas>
    <button onclick="download('icon180', 'icon-180.png')">Download icon-180.png</button>
  </div>

  <div class="icon-group">
    <h3>Android Icon (192x192)</h3>
    <canvas id="icon192" width="192" height="192"></canvas>
    <button onclick="download('icon192', 'icon-192.png')">Download icon-192.png</button>
  </div>

  <div class="icon-group">
    <h3>Large Icon (512x512)</h3>
    <canvas id="icon512" width="512" height="512"></canvas>
    <button onclick="download('icon512', 'icon-512.png')">Download icon-512.png</button>
  </div>

  <div class="icon-group">
    <h3>Favicon (32x32)</h3>
    <canvas id="icon32" width="32" height="32"></canvas>
    <button onclick="download('icon32', 'icon-32.png')">Download icon-32.png</button>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;

      // Background with rounded corners
      const radius = size * 0.18;
      ctx.fillStyle = '#1e1e1e';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();

      // Letter J
      ctx.fillStyle = '#4a9eff';
      ctx.font = `600 ${size * 0.55}px system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('J', size * 0.5, size * 0.55);

      // Orange accent dot
      ctx.fillStyle = '#ff6b35';
      ctx.beginPath();
      ctx.arc(size * 0.74, size * 0.27, size * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Draw all icons on load
    ['icon180', 'icon192', 'icon512', 'icon32'].forEach(id => {
      drawIcon(document.getElementById(id));
    });
  </script>
</body>
</html>
